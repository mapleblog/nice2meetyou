<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://daycount-vietnam-default-rtdb.asia-southeast1.firebasedatabase.app wss://daycount-vietnam-default-rtdb.asia-southeast1.firebasedatabase.app https://identitytoolkit.googleapis.com https://www.googleapis.com https://www.gstatic.com; img-src 'self'; media-src 'self';">
    <title>用户登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_page.css">
</head>
<body>

    <div class="container">
        <span class="badge">🌸</span>
        <h1 class="card-title">Welcome Back</h1>
        <p class="subtitle">Our little corner of the world</p>

        <form id="loginForm" class="form">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="error-message" id="loginError"></div>
            <button type="submit">Enter Our Story ✿</button>
        </form>
    </div>

    <div id="petals"></div>
    <script src="js/login-petals.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" integrity="sha384-v3Z/Xdw1sCeo6M/geW7sn1Lt9obIm7MhAk8laVV+rvYFmzuWDELOiygx7dVte2dX" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" integrity="sha384-p62xBRve8PdqGDGASZtZMuHgPsyPcT5VsFwgmz2p4zaFdEtt5ZzNqxK+CLzQS7xP" crossorigin="anonymous"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login_page.js"></script>
</body>
</html>
