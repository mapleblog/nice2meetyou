<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://daycount-vietnam-default-rtdb.asia-southeast1.firebasedatabase.app wss://daycount-vietnam-default-rtdb.asia-southeast1.firebasedatabase.app https://identitytoolkit.googleapis.com https://www.googleapis.com https://www.gstatic.com; img-src 'self'; media-src 'self';">
    <title>用户登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_page.css">
</head>
<body>

    <div class="container">
        <span class="badge">🌸</span>
        <h1 class="card-title">Welcome Back</h1>
        <p class="subtitle">Our little corner of the world</p>

        <form id="loginForm" class="form">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="error-message" id="loginError"></div>
            <button type="submit">Enter Our Story ✿</button>
        </form>
    </div>

    <div id="petals"></div>
    <script>
        const petalEl = document.getElementById('petals');
        const shapes = [
            'M10,0 Q16,4 12,10 Q8,14 4,10 Q0,4 6,0 Q8,-2 10,0Z',
            'M8,0 Q14,3 11,9 Q8,13 3,9 Q0,4 5,0 Q6,-1 8,0Z',
            'M6,0 Q12,5 8,11 Q4,14 1,8 Q-1,2 5,0 Q5.5,-0.5 6,0Z',
        ];
        const pinks = ['#f5a8c0','#f0c0d0','#e890b0','#fbd0de','#f2b0c8'];
        for (let i = 0; i < 55; i++) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            const size = Math.random() * 14 + 7;
            svg.setAttribute('viewBox', '-2 -2 18 18');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.style.cssText = `
                left:${Math.random()*104-2}%;
                top:-20px;
                --dur:${(Math.random()*9+7).toFixed(1)}s;
                --delay:${(Math.random()*12).toFixed(1)}s;
                --drift:${((Math.random()-0.5)*200).toFixed(0)}px;
                --spin:${(Math.random()*720-360).toFixed(0)}deg;
                --op:${(Math.random()*0.5+0.35).toFixed(2)};
            `;
            svg.classList.add('petal');
            const path = document.createElementNS(ns, 'path');
            path.setAttribute('d', shapes[Math.floor(Math.random()*shapes.length)]);
            path.setAttribute('fill', pinks[Math.floor(Math.random()*pinks.length)]);
            svg.appendChild(path);
            petalEl.appendChild(svg);
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" integrity="sha384-v3Z/Xdw1sCeo6M/geW7sn1Lt9obIm7MhAk8laVV+rvYFmzuWDELOiygx7dVte2dX" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" integrity="sha384-p62xBRve8PdqGDGASZtZMuHgPsyPcT5VsFwgmz2p4zaFdEtt5ZzNqxK+CLzQS7xP" crossorigin="anonymous"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login_page.js"></script>
</body>
</html>
