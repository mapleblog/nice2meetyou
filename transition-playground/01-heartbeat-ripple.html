<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition 01 — Heartbeat Ripple</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Lato', sans-serif; }

    /* ─── Screens ─── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #login {
      background: linear-gradient(160deg, #fff0f5 0%, #ffd6e7 40%, #ffb3cc 100%);
      z-index: 1;
      transition: opacity 0.45s ease;
    }
    #home {
      background: linear-gradient(160deg, #fce4ec 0%, #f48fb1 55%, #e91e8c 100%);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    #home.show { opacity: 1; z-index: 3; }

    /* ─── Login card ─── */
    .card {
      width: 390px; padding: 50px 42px 42px;
      background: rgba(255,255,255,0.72); backdrop-filter: blur(18px);
      border-radius: 28px; text-align: center;
      box-shadow: 0 20px 60px rgba(255,110,160,0.22), 0 0 0 1px rgba(255,255,255,0.5);
    }
    .badge { font-size: 2.8rem; margin-bottom: 10px; display: block; }
    .card h1 { font-family: 'Playfair Display', serif; font-size: 1.65rem; color: #c2185b; margin-bottom: 4px; }
    .card .sub { font-size: 0.82rem; color: #e88fad; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 32px; font-style: italic; }
    .field { margin-bottom: 20px; text-align: left; }
    .field label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #d4819c; margin-bottom: 6px; }
    .field input { width: 100%; padding: 13px 16px; background: rgba(255,220,235,0.35); border: 1.5px solid rgba(255,150,185,0.4); border-radius: 12px; font-family: 'Lato', sans-serif; font-size: 0.95rem; color: #7b2d4a; outline: none; transition: border-color 0.25s, background 0.25s; }
    .field input::placeholder { color: #e8a8be; }
    .field input:focus { border-color: #f06292; background: rgba(255,220,235,0.55); }
    .btn { width: 100%; margin-top: 8px; padding: 14px; background: linear-gradient(135deg, #f48fb1, #e91e8c); color: #fff; border: none; border-radius: 14px; font-family: 'Playfair Display', serif; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; box-shadow: 0 6px 22px rgba(233,30,140,0.35); transition: opacity 0.2s, transform 0.15s; }
    .btn:hover { opacity: 0.88; transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.99); }

    /* ─── Transition overlay ─── */
    #overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    /* Sakura petals on login background */
    .petal {
      position: fixed; pointer-events: none;
      border-radius: 50% 0 50% 0;
      opacity: 0.75;
      animation: petal-fall linear infinite;
    }
    @keyframes petal-fall {
      0%   { transform: translateY(-40px) rotate(0deg) translateX(0); opacity: 0.8; }
      50%  { transform: translateY(48vh) rotate(180deg) translateX(35px); }
      100% { transform: translateY(110vh) rotate(360deg) translateX(-15px); opacity: 0; }
    }

    /* Heartbeat rings */
    .ring {
      position: absolute; left: 50%; top: 50%;
      width: 90px; height: 90px; border-radius: 50%;
      border: 2.5px solid rgba(233,30,140,0.85);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    .ring.fire { animation: ring-out 0.95s ease-out forwards; }
    .ring:nth-child(2).fire { animation-delay: 0.09s; }
    .ring:nth-child(3).fire { animation-delay: 0.18s; }
    .ring:nth-child(4).fire { animation-delay: 0.27s; }
    .ring:nth-child(5).fire { animation-delay: 0.36s; }
    @keyframes ring-out {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.95; }
      60%  { opacity: 0.6; }
      100% { transform: translate(-50%,-50%) scale(30); opacity: 0; }
    }

    /* Heart icon center pulse */
    #heartIcon {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 3.5rem; opacity: 0; z-index: 10;
    }

    /* Fill circle */
    #fillCircle {
      position: absolute; left: 50%; top: 50%;
      width: 130px; height: 130px; border-radius: 50%;
      background: linear-gradient(135deg, #e91e8c, #c2185b);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    /* ─── Home screen ─── */
    .home-wrap { text-align: center; }
    .home-icon { font-size: 5.5rem; display: block; margin-bottom: 22px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    .home-wrap h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 24px rgba(0,0,0,0.15); }
    .home-wrap p { color: rgba(255,255,255,0.82); font-style: italic; margin-bottom: 32px; font-size: 1rem; letter-spacing: 0.03em; }
    .back { padding: 11px 28px; background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.45); border-radius: 22px; color: #fff; cursor: pointer; font-size: 0.85rem; letter-spacing: 0.06em; transition: background 0.2s; font-family: 'Lato', sans-serif; }
    .back:hover { background: rgba(255,255,255,0.32); }

    /* ─── Playground label ─── */
    .pg-label { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(194,24,91,0.22); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.28); color: rgba(255,255,255,0.92); padding: 5px 16px; border-radius: 16px; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; z-index: 100; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="pg-label">Transition 01 — Heartbeat Ripple</div>

  <!-- Login Screen -->
  <div class="screen" id="login">
    <div class="card">
      <span class="badge">🌸</span>
      <h1>Welcome Back</h1>
      <p class="sub">Our little corner of the world</p>
      <div class="field"><label>Email</label><input type="email" placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <button class="btn" onclick="startTransition()">Enter Our Story ✿</button>
    </div>
  </div>

  <!-- Transition Overlay -->
  <div id="overlay">
    <div id="heartIcon">💗</div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div id="fillCircle"></div>
  </div>

  <!-- Home Screen -->
  <div class="screen" id="home">
    <div class="home-wrap">
      <span class="home-icon">💕</span>
      <h2>You're home, my love</h2>
      <p>Every story is better with you in it.</p>
      <button class="back" onclick="resetDemo()">← Try Again</button>
    </div>
  </div>

  <script>
    const loginEl  = document.getElementById('login');
    const homeEl   = document.getElementById('home');
    const fillEl   = document.getElementById('fillCircle');
    const heartEl  = document.getElementById('heartIcon');
    const rings    = document.querySelectorAll('#overlay .ring');
    const overlay  = document.getElementById('overlay');

    // Sakura petals on login
    const colors = ['#ffb7c5','#ffc0cb','#ff9eb5','#ff85a1','#ffccd5'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.cssText = `
        left:${Math.random()*100}vw;
        top:-40px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${10+Math.random()*12}px;
        height:${10+Math.random()*12}px;
        animation-duration:${4+Math.random()*6}s;
        animation-delay:${-Math.random()*8}s;
        border-radius:${Math.random()>0.5?'50% 0 50% 0':'0 50% 0 50%'};
        z-index:1;
      `;
      loginEl.appendChild(p);
    }

    function startTransition() {
      // 1. Heart pops
      heartEl.style.transition = 'transform 0.35s cubic-bezier(0.17,0.67,0.4,1.3), opacity 0.2s';
      heartEl.style.opacity = '1';
      heartEl.style.transform = 'translate(-50%, -50%) scale(1)';

      // 2. Rings fire (staggered via CSS delays — add class)
      rings.forEach(r => r.classList.add('fire'));

      // 3. Fill circle expands — covers screen by ~900ms
      setTimeout(() => {
        fillEl.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1), opacity 0.05s';
        fillEl.style.opacity = '1';
        fillEl.style.transform = 'translate(-50%,-50%) scale(40)';
      }, 280);

      // 4. Swap screens as fill covers everything
      setTimeout(() => {
        loginEl.style.opacity = '0';
        homeEl.classList.add('show');
        heartEl.style.opacity = '0';
      }, 920);

      // 5. Fade the fill out to reveal home
      setTimeout(() => {
        fillEl.style.transition = 'opacity 0.55s ease-out';
        fillEl.style.opacity = '0';
      }, 980);
    }

    function resetDemo() {
      // Snap fill back (no transition)
      fillEl.style.transition = 'none';
      fillEl.style.transform = 'translate(-50%,-50%) scale(0)';
      fillEl.style.opacity = '0';

      // Reset heart
      heartEl.style.transition = 'none';
      heartEl.style.transform = 'translate(-50%, -50%) scale(0)';
      heartEl.style.opacity = '0';

      // Remove ring animations (force reflow to allow re-trigger)
      rings.forEach(r => {
        r.classList.remove('fire');
        void r.offsetWidth;
      });

      // Restore screens
      loginEl.style.opacity = '1';
      homeEl.classList.remove('show');
    }
  </script>
</body>
</html>
