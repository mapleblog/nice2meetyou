<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design 3 — Floating Dock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #1a0a2e 0%, #3d1a5c 35%, #7a2d6b 65%, #c45e82 100%);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 80px;
  }

  .design-label {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    color: white;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    z-index: 100;
    white-space: nowrap;
  }

  .features-section {
    width: 100%;
    max-width: 480px;
    background: rgba(0,0,0,0.28);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    overflow: visible; /* allow dock to breathe */
    min-height: 420px;
    position: relative;
  }

  .feature-content {
    display: none;
    padding: 24px 20px 28px;
    flex: 1;
    animation: fadeUp 0.35s ease;
    border-radius: 20px 20px 0 0;
  }
  .feature-content.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .content-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: white;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .content-title i { color: #f472b6; }

  .mock-input {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    color: rgba(255,255,255,0.4);
    font-size: 0.85rem;
    width: 100%;
    margin-bottom: 10px;
  }
  .mock-textarea { height: 70px; resize: none; }
  .mock-btn {
    background: linear-gradient(135deg, #c45e82, #f472b6);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 22px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mock-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }
  .mock-card {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.72);
  }
  .mock-card strong { color: #f9a8d4; display: block; margin-bottom: 3px; font-size: 0.78rem; }

  /* ─── DESIGN 3: FLOATING DOCK ─── */
  /* The dock sits BELOW the section card as a floating island */
  .bottom-nav {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px 10px;
    background: rgba(12, 4, 22, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 0 0 20px 20px;
  }

  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* Icon container — a floating card */
  .tab-icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    transition: background 0.3s ease, border-color 0.3s ease,
                box-shadow 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }

  /* Shimmer layer inside icon card */
  .tab-icon-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%);
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .tab-btn i {
    font-size: 1.3rem;
    color: rgba(255,255,255,0.4);
    transition: color 0.3s ease, transform 0.3s ease;
    position: relative;
    z-index: 1;
  }

  .tab-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.3);
    transition: color 0.3s ease;
  }

  /* ACTIVE state — icon card lifts and glows */
  .tab-btn.active {
    transform: translateY(-6px);
  }

  .tab-btn.active .tab-icon-wrap {
    background: linear-gradient(135deg, rgba(196,94,130,0.5), rgba(244,114,182,0.35));
    border-color: rgba(244,114,182,0.4);
    box-shadow:
      0 8px 24px rgba(244,114,182,0.35),
      0 2px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.15);
    transform: scale(1.12);
  }

  .tab-btn.active .tab-icon-wrap::before { opacity: 1; }

  .tab-btn.active i {
    color: #fff;
    transform: scale(1.1);
    filter: drop-shadow(0 0 6px rgba(244,114,182,0.8));
  }

  .tab-btn.active .tab-label {
    color: #f9a8d4;
  }

  /* Active dot below label */
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #f472b6;
    box-shadow: 0 0 8px #f472b6;
  }

  /* Hover (inactive) */
  .tab-btn:not(.active):hover .tab-icon-wrap {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-3px);
  }
  .tab-btn:not(.active):hover i { color: rgba(255,255,255,0.7); }
  .tab-btn:not(.active):hover .tab-label { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>

<div class="design-label">Design 3 · Floating Dock — card icons that lift on select</div>

<section class="features-section">

  <div class="feature-content active" id="p-messages">
    <div class="content-title"><i class="fas fa-comments"></i> 留言板</div>
    <input class="mock-input" placeholder="您的昵称" readonly>
    <textarea class="mock-input mock-textarea" placeholder="写下您想说的话..."></textarea>
    <button class="mock-btn">发送</button>
    <div class="mock-cards">
      <div class="mock-card"><strong>啊庄 · 2025-06-01</strong>今天天气很好，想你了 🌸</div>
      <div class="mock-card"><strong>啊康 · 2025-05-30</strong>等你来马来西亚！</div>
    </div>
  </div>

  <div class="feature-content" id="p-diary">
    <div class="content-title"><i class="fas fa-book-open"></i> 心情日记</div>
    <input class="mock-input" placeholder="日记标题" readonly>
    <textarea class="mock-input mock-textarea" placeholder="写下今天的心情和感受..."></textarea>
    <button class="mock-btn">保存日记</button>
    <div class="mock-cards">
      <div class="mock-card"><strong>开心 · 2025-06-02</strong>今天收到了你的礼物，超级开心！</div>
    </div>
  </div>

  <div class="feature-content" id="p-wishlist">
    <div class="content-title"><i class="fas fa-star"></i> 愿望清单</div>
    <input class="mock-input" placeholder="愿望标题" readonly>
    <textarea class="mock-input mock-textarea" placeholder="描述您的愿望..."></textarea>
    <button class="mock-btn">添加愿望</button>
    <div class="mock-cards">
      <div class="mock-card"><strong>✈️ 旅行</strong>一起去日本看樱花</div>
      <div class="mock-card"><strong>🍜 美食</strong>学做越南河粉给你吃</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="tab-btn active" data-target="p-messages">
      <div class="tab-icon-wrap"><i class="fas fa-comments"></i></div>
      <span class="tab-label">留言板</span>
    </button>
    <button class="tab-btn" data-target="p-diary">
      <div class="tab-icon-wrap"><i class="fas fa-book-open"></i></div>
      <span class="tab-label">心情日记</span>
    </button>
    <button class="tab-btn" data-target="p-wishlist">
      <div class="tab-icon-wrap"><i class="fas fa-star"></i></div>
      <span class="tab-label">愿望清单</span>
    </button>
  </nav>

</section>

<script>
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.feature-content').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(this.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
