<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Bar — Moonlit Romance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; background: #06030e; }

    .bg {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #0d0520 0%, #1a0838 30%, #0e1230 60%, #060318 100%);
    }
    .moon {
      position: fixed; top: 8%; right: 14%;
      width: 88px; height: 88px; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #fffbe8, #f5e090 60%, #e0c060);
      box-shadow: 0 0 50px 20px rgba(240,210,80,0.18), 0 0 120px 60px rgba(240,210,80,0.07);
    }
    .moon-halo {
      position: fixed; top: calc(8% - 20px); right: calc(14% - 20px);
      width: 128px; height: 128px; border-radius: 50%;
      border: 1px solid rgba(240,210,80,0.1);
      box-shadow: 0 0 30px rgba(240,210,80,0.05);
    }
    #star-canvas { position: fixed; inset: 0; }

    .scene { position: fixed; bottom: 82px; left: 0; width: 100%; pointer-events: none; }
    .scene svg { display: block; width: 100%; }

    .couple-label {
      position: fixed; top: 44%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; pointer-events: none; user-select: none;
    }
    .couple-label .name {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.1rem; color: rgba(220,190,255,0.28); letter-spacing: 0.06em;
    }
    .couple-label .divider { font-size: 0.85rem; color: rgba(220,190,255,0.16); display: block; margin: 6px 0; }

    /* ── Bar ── */
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
      background: rgba(6, 2, 18, 0.75);
      border-top: 1px solid rgba(160, 100, 255, 0.16);
      backdrop-filter: blur(30px) saturate(1.6);
      box-shadow: 0 -6px 40px rgba(80,20,180,0.14), inset 0 1px 0 rgba(180,120,255,0.07);
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
      z-index: 100;
    }

    /* Thin progress line */
    .prog-rail {
      position: absolute; top: -1px; left: 0; right: 0; height: 2px;
      background: rgba(160,100,255,0.1); cursor: pointer;
    }
    .prog-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6d28d9, #c026d3);
      transition: width 0.35s linear;
      position: relative;
    }
    .prog-fill::after {
      content: ''; position: absolute; right: -4px; top: -3px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #c084fc; box-shadow: 0 0 8px rgba(192,132,252,0.8);
    }

    /* Left */
    .bar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .art {
      width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(#2d1458, #7c3aed, #a855f7, #db2777, #7c3aed, #2d1458);
      animation: spin 5s linear infinite; animation-play-state: paused;
      box-shadow: 0 0 16px rgba(124,58,237,0.45);
      position: relative;
    }
    .art.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .art::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 16px; height: 16px; border-radius: 50%;
      background: #06020e;
    }
    .track-info { min-width: 0; }
    .track-title {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 0.9rem; color: #e2d4ff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.67rem; color: rgba(192,148,255,0.42);
      letter-spacing: 0.1em; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .like-btn {
      background: none; border: none; cursor: pointer; flex-shrink: 0;
      font-size: 1rem; color: rgba(192,100,220,0.35);
      transition: color 0.2s, transform 0.15s; padding: 4px;
    }
    .like-btn:hover { color: #e879f9; transform: scale(1.2); }
    .like-btn.on { color: #e879f9; }

    /* Center */
    .bar-center { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .skip-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.88rem; color: rgba(192,148,255,0.4);
      padding: 8px; transition: color 0.2s, transform 0.15s; line-height: 1;
    }
    .skip-btn:hover { color: #c084fc; transform: scale(1.12); }
    .play-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; color: #fff;
      box-shadow: 0 4px 18px rgba(109,40,217,0.5);
      transition: transform 0.13s, box-shadow 0.13s;
    }
    .play-btn:hover { transform: scale(1.09); box-shadow: 0 6px 26px rgba(109,40,217,0.68); }
    .play-btn:active { transform: scale(0.93); }

    /* Right */
    .bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .time-display { font-size: 0.67rem; color: rgba(192,148,255,0.32); white-space: nowrap; }
    .vol-group { display: flex; align-items: center; gap: 8px; }
    .vol-ico { font-size: 0.72rem; color: rgba(192,148,255,0.28); }
    input[type=range] {
      width: 78px; -webkit-appearance: none; appearance: none;
      height: 3px; background: rgba(160,100,255,0.1);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #7c3aed;
      box-shadow: 0 0 5px rgba(124,58,237,0.5);
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="moon"></div>
<div class="moon-halo"></div>
<canvas id="star-canvas"></canvas>

<div class="scene">
  <svg viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,160 L0,100 Q200,65 360,88 Q520,110 600,68 Q680,28 720,52 Q760,28 800,68 Q880,108 1060,88 Q1220,72 1440,92 L1440,160 Z" fill="rgba(18,6,38,0.75)"/>
    <path d="M0,160 L0,122 Q240,96 400,116 Q560,136 680,108 Q800,80 880,100 Q960,120 1100,110 Q1260,98 1440,114 L1440,160 Z" fill="rgba(8,2,20,0.88)"/>
  </svg>
</div>

<div class="couple-label">
  <div class="name">Thuy Trang</div>
  <span class="divider">✦</span>
  <div class="name">Dinh Khang</div>
</div>

<div class="bar">
  <div class="prog-rail" id="prog-rail"><div class="prog-fill" id="prog-fill"></div></div>

  <div class="bar-left">
    <div class="art" id="art"></div>
    <div class="track-info">
      <div class="track-title" id="t-title">海浪声</div>
      <div class="track-artist" id="t-artist">Just Us</div>
    </div>
    <button class="like-btn" id="like">♡</button>
  </div>

  <div class="bar-center">
    <button class="skip-btn" id="prev">⏮</button>
    <button class="play-btn" id="play">▶</button>
    <button class="skip-btn" id="next">⏭</button>
  </div>

  <div class="bar-right">
    <span class="time-display" id="time">0:00 / 3:24</span>
    <div class="vol-group">
      <span class="vol-ico">🔈</span>
      <input type="range" min="0" max="100" value="70">
      <span class="vol-ico">🔊</span>
    </div>
  </div>
</div>

<script>
  // Star canvas
  const cv = document.getElementById('star-canvas');
  const cx = cv.getContext('2d');
  function rsz(){ cv.width=innerWidth; cv.height=innerHeight; }
  rsz(); window.addEventListener('resize',rsz);
  const ss = Array.from({length:220},()=>({x:Math.random(),y:Math.random()*0.78,r:Math.random()*1.4+0.2,a:Math.random()*0.55+0.1,sp:Math.random()*0.014+0.004,ph:Math.random()*Math.PI*2}));
  (function draw(t){
    cx.clearRect(0,0,cv.width,cv.height);
    ss.forEach(s=>{const a=s.a*(0.5+0.5*Math.sin(t*s.sp+s.ph));cx.beginPath();cx.arc(s.x*cv.width,s.y*cv.height,s.r,0,Math.PI*2);cx.fillStyle=`rgba(255,255,255,${a.toFixed(2)})`;cx.fill();});
    requestAnimationFrame(draw);
  })(0);

  // Player
  const tracks=[
    {title:'海浪声',artist:'Just Us',dur:204},
    {title:'Together',artist:'Thuy Trang & Dinh Khang',dur:252},
    {title:'Sakura Path',artist:'Love Story',dur:238},
    {title:'Nice to Meet You',artist:'Just Us',dur:301},
  ];
  let idx=0,playing=false,elapsed=0,timer=null,liked=false;
  const art=document.getElementById('art'),playBtn=document.getElementById('play'),
        fill=document.getElementById('prog-fill'),timeEl=document.getElementById('time'),
        likeBtn=document.getElementById('like');
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60|0).padStart(2,'0')}`;
  function load(i){
    idx=i;elapsed=0;
    document.getElementById('t-title').textContent=tracks[i].title;
    document.getElementById('t-artist').textContent=tracks[i].artist;
    fill.style.width='0%';
    timeEl.textContent=`0:00 / ${fmt(tracks[i].dur)}`;
  }
  function tick(){
    elapsed++;
    if(elapsed>=tracks[idx].dur){load((idx+1)%tracks.length);if(playing)restart();return;}
    fill.style.width=(elapsed/tracks[idx].dur*100)+'%';
    timeEl.textContent=`${fmt(elapsed)} / ${fmt(tracks[idx].dur)}`;
  }
  function restart(){clearInterval(timer);timer=setInterval(tick,1000);}
  function setPlay(s){playing=s;art.classList.toggle('playing',s);playBtn.textContent=s?'⏸':'▶';s?restart():clearInterval(timer);}
  playBtn.addEventListener('click',()=>setPlay(!playing));
  document.getElementById('prev').addEventListener('click',()=>{load((idx-1+tracks.length)%tracks.length);if(playing)restart();});
  document.getElementById('next').addEventListener('click',()=>{load((idx+1)%tracks.length);if(playing)restart();});
  likeBtn.addEventListener('click',()=>{liked=!liked;likeBtn.classList.toggle('on',liked);likeBtn.textContent=liked?'♥':'♡';});
  document.getElementById('prog-rail').addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    elapsed=Math.floor((e.clientX-r.left)/r.width*tracks[idx].dur);
    fill.style.width=(elapsed/tracks[idx].dur*100)+'%';
    timeEl.textContent=`${fmt(elapsed)} / ${fmt(tracks[idx].dur)}`;
  });
  load(0);
</script>
</body>
</html>
