<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition 03 — Iris Bloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Lato', sans-serif; }

    /* ─── Screens ─── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #login {
      background: linear-gradient(160deg, #fff8f0 0%, #ffe4cc 45%, #ffcba4 100%);
      z-index: 1;
      transition: opacity 0.3s ease;
    }
    #home {
      background: linear-gradient(160deg, #f0fff4 0%, #c8f5d4 40%, #a8edbe 80%, #72c99a 100%);
      z-index: 2;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 1.1s cubic-bezier(0.4, 0, 0.15, 1);
    }
    #home.bloom {
      clip-path: circle(150% at 50% 50%);
    }

    /* ─── Sakura petals (login bg) ─── */
    .petal {
      position: fixed; pointer-events: none;
      animation: petal-fall linear infinite;
    }
    @keyframes petal-fall {
      0%   { transform: translateY(-40px) rotate(0deg) translateX(0); opacity: 0.7; }
      50%  { transform: translateY(48vh) rotate(180deg) translateX(30px); }
      100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); opacity: 0; }
    }

    /* ─── Login card ─── */
    .card {
      position: relative; z-index: 2;
      width: 390px; padding: 50px 42px 42px;
      background: rgba(255,255,255,0.68); backdrop-filter: blur(18px);
      border-radius: 28px; text-align: center;
      box-shadow: 0 20px 60px rgba(255,150,80,0.18), 0 0 0 1px rgba(255,255,255,0.55);
    }
    .badge { font-size: 2.8rem; margin-bottom: 10px; display: block; }
    .card h1 { font-family: 'Playfair Display', serif; font-size: 1.65rem; color: #c05000; margin-bottom: 4px; }
    .card .sub { font-size: 0.82rem; color: #e8945a; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 32px; font-style: italic; }
    .field { margin-bottom: 20px; text-align: left; }
    .field label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #d07040; margin-bottom: 6px; }
    .field input { width: 100%; padding: 13px 16px; background: rgba(255,210,170,0.28); border: 1.5px solid rgba(220,140,80,0.35); border-radius: 12px; font-family: 'Lato', sans-serif; font-size: 0.95rem; color: #8b3800; outline: none; transition: border-color 0.25s, background 0.25s; }
    .field input::placeholder { color: #d09870; }
    .field input:focus { border-color: rgba(220,140,80,0.65); background: rgba(255,210,170,0.45); }
    .btn { width: 100%; margin-top: 8px; padding: 14px; background: linear-gradient(135deg, #f0a060, #c05000); color: #fff; border: none; border-radius: 14px; font-family: 'Playfair Display', serif; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; box-shadow: 0 6px 22px rgba(180,80,0,0.32); transition: opacity 0.2s, transform 0.15s; }
    .btn:hover { opacity: 0.88; transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.99); }

    /* ─── Bloom petals (eruption from center) ─── */
    #petalLayer { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

    .bloom-petal {
      position: absolute; left: 50%; top: 50%;
      border-radius: 50% 0 50% 0;
      pointer-events: none;
      opacity: 0;
    }

    /* ─── Home screen ─── */
    .home-wrap { text-align: center; z-index: 2; position: relative; }
    .bloom-icon { font-size: 5rem; display: block; margin-bottom: 20px; animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
    .home-wrap h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #2d6e45; margin-bottom: 10px; }
    .home-wrap p { color: rgba(40,100,60,0.75); font-style: italic; margin-bottom: 32px; font-size: 1rem; letter-spacing: 0.03em; }
    .back { padding: 11px 28px; background: rgba(255,255,255,0.45); border: 1.5px solid rgba(80,160,100,0.4); border-radius: 22px; color: #2d6e45; cursor: pointer; font-size: 0.85rem; letter-spacing: 0.06em; transition: background 0.2s; font-family: 'Lato', sans-serif; }
    .back:hover { background: rgba(255,255,255,0.65); }

    /* ─── Center bloom ring indicator ─── */
    #bloomRing {
      position: fixed; left: 50%; top: 50%;
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid rgba(200,120,60,0.7);
      transform: translate(-50%,-50%) scale(0);
      z-index: 10; pointer-events: none;
      opacity: 0;
    }
    #bloomRing.pulse {
      animation: bloom-ring 0.5s ease-out forwards;
    }
    @keyframes bloom-ring {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(8); opacity: 0; }
    }

    /* ─── Label ─── */
    .pg-label { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(180,80,0,0.22); backdrop-filter: blur(8px); border: 1px solid rgba(255,200,150,0.35); color: rgba(255,220,180,0.95); padding: 5px 16px; border-radius: 16px; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; z-index: 100; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="pg-label">Transition 03 — Iris Bloom</div>

  <!-- Login Screen -->
  <div class="screen" id="login">
    <div class="card">
      <span class="badge">🌼</span>
      <h1>Welcome Back</h1>
      <p class="sub">Our little corner of the world</p>
      <div class="field"><label>Email</label><input type="email" placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <button class="btn" onclick="startTransition()">Enter Our Story ✿</button>
    </div>
  </div>

  <!-- Bloom ring & petals layer -->
  <div id="bloomRing"></div>
  <div id="petalLayer"></div>

  <!-- Home Screen (iris revealed) -->
  <div class="screen" id="home">
    <div class="home-wrap">
      <span class="bloom-icon">🌸</span>
      <h2>A new chapter begins</h2>
      <p>Together, even the simplest days become beautiful.</p>
      <button class="back" onclick="resetDemo()">← Try Again</button>
    </div>
  </div>

  <script>
    const loginEl    = document.getElementById('login');
    const homeEl     = document.getElementById('home');
    const bloomRing  = document.getElementById('bloomRing');
    const petalLayer = document.getElementById('petalLayer');

    // Falling sakura petals on login
    const petalColors = ['#ffb7c5','#ffc8a8','#ffd6b8','#ffaacc','#ffcce0'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.cssText = `
        left:${Math.random()*100}vw;
        top:-40px;
        background:${petalColors[Math.floor(Math.random()*petalColors.length)]};
        width:${10+Math.random()*12}px;
        height:${10+Math.random()*12}px;
        animation-duration:${4.5+Math.random()*6}s;
        animation-delay:${-Math.random()*9}s;
        border-radius:${Math.random()>0.5?'50% 0 50% 0':'0 50% 0 50%'};
        z-index:1;
      `;
      loginEl.appendChild(p);
    }

    let running = false;

    function startTransition() {
      if (running) return;
      running = true;

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      // 1. Bloom ring pulse from center (visual cue)
      bloomRing.classList.add('pulse');

      // 2. Erupt petals outward from center (fountain effect)
      setTimeout(() => {
        spawnBloomPetals(cx, cy);
      }, 80);

      // 3. Iris opens — home screen clip-path blooms
      setTimeout(() => {
        homeEl.classList.add('bloom');
      }, 220);

      // 4. Login fades behind (optional, since home is on top)
      setTimeout(() => {
        loginEl.style.opacity = '0';
      }, 500);

      // 5. Petal layer fades out
      setTimeout(() => {
        petalLayer.style.transition = 'opacity 0.5s ease-out';
        petalLayer.style.opacity = '0';
      }, 900);
    }

    function spawnBloomPetals(cx, cy) {
      const colors = ['#ffb7c5','#ffc8a8','#ffeaa8','#c8f0d4','#b8e4f8','#e8b8ff'];
      const count  = 48;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'bloom-petal';
        const angle    = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const dist     = 80 + Math.random() * 180;
        const size     = 8 + Math.random() * 14;
        const delay    = Math.random() * 150;
        const duration = 600 + Math.random() * 400;
        const color    = colors[Math.floor(Math.random() * colors.length)];
        const spinDir  = Math.random() > 0.5 ? 1 : -1;
        const spin     = spinDir * (90 + Math.random() * 200);

        el.style.cssText = `
          left:${cx}px; top:${cy}px;
          width:${size}px; height:${size}px;
          background:${color};
          transform:translate(-50%,-50%) rotate(0deg);
          opacity:0;
          position:absolute;
        `;
        petalLayer.appendChild(el);

        setTimeout(() => {
          el.style.transition = `transform ${duration}ms cubic-bezier(0.2,0.8,0.3,1), opacity ${duration}ms ease-out`;
          el.style.opacity = '0.9';
          el.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) rotate(${spin}deg) scale(0.5)`;

          setTimeout(() => {
            el.style.opacity = '0';
          }, duration * 0.45);

          setTimeout(() => el.remove(), duration + 50);
        }, delay);
      }

      // Second wave — slower, wider
      setTimeout(() => {
        for (let i = 0; i < 24; i++) {
          const el2 = document.createElement('div');
          el2.className = 'bloom-petal';
          const angle  = (i / 24) * Math.PI * 2 + Math.random() * 0.5;
          const dist   = 140 + Math.random() * 140;
          const size   = 10 + Math.random() * 12;
          const dur    = 700 + Math.random() * 350;
          const color  = colors[Math.floor(Math.random() * colors.length)];
          const spin   = (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 180);

          el2.style.cssText = `
            left:${cx}px; top:${cy}px;
            width:${size}px; height:${size}px;
            background:${color};
            border-radius:${Math.random()>0.5?'50% 0 50% 0':'0 50% 0 50%'};
            transform:translate(-50%,-50%) rotate(0deg);
            opacity:0;
            position:absolute;
          `;
          petalLayer.appendChild(el2);

          requestAnimationFrame(() => {
            el2.style.transition = `transform ${dur}ms cubic-bezier(0.15,0.85,0.3,1), opacity ${dur}ms ease-out`;
            el2.style.opacity = '0.8';
            el2.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) rotate(${spin}deg) scale(0.4)`;
            setTimeout(() => { el2.style.opacity = '0'; }, dur * 0.4);
            setTimeout(() => el2.remove(), dur + 50);
          });
        }
      }, 200);
    }

    function resetDemo() {
      running = false;

      homeEl.style.transition = 'none';
      homeEl.classList.remove('bloom');
      void homeEl.offsetWidth;
      homeEl.style.transition = '';

      bloomRing.className = 'bloomRing';
      void bloomRing.offsetWidth;

      petalLayer.innerHTML = '';
      petalLayer.style.transition = 'none';
      petalLayer.style.opacity = '1';

      loginEl.style.opacity = '1';
    }
  </script>
</body>
</html>
