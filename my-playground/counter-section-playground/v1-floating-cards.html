<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V1 — Floating Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Starfield */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--d) ease-in-out infinite alternate;
      opacity: var(--o);
    }
    @keyframes twinkle { to { opacity: 0.1; transform: scale(0.6); } }

    .counter-section {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px;
    }

    /* Title */
    .days-label {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 180, 220, 0.8);
    }
    .days-sublabel {
      font-size: 0.72rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 40px;
    }

    /* Cards row */
    .counter-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .counter {
      position: relative;
      width: 110px;
      height: 130px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: default;
      animation: floatCard 5s ease-in-out infinite;
      transition: transform 0.3s;
    }
    .counter:nth-child(1) { animation-delay: 0s;    background: linear-gradient(145deg, #2d1b69, #11998e); box-shadow: 0 8px 32px rgba(17,153,142,0.4); }
    .counter:nth-child(2) { animation-delay: 0.4s;  background: linear-gradient(145deg, #6a1a6a, #c94b8c); box-shadow: 0 8px 32px rgba(201,75,140,0.4); }
    .counter:nth-child(3) { animation-delay: 0.8s;  background: linear-gradient(145deg, #1a2a6a, #3a7bd5); box-shadow: 0 8px 32px rgba(58,123,213,0.4); }
    .counter:nth-child(4) { animation-delay: 1.2s;  background: linear-gradient(145deg, #3d1a0a, #f7971e); box-shadow: 0 8px 32px rgba(247,151,30,0.4); }

    .counter::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 19px;
      background: rgba(255,255,255,0.06);
      pointer-events: none;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    .counter:hover { transform: translateY(-12px) scale(1.05) !important; }

    .counter .num {
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .counter .label {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-top: 8px;
    }

    /* Dividers between cards */
    .sep {
      display: flex;
      align-items: center;
      color: rgba(255,255,255,0.25);
      font-size: 1.8rem;
      font-weight: 300;
      padding-bottom: 20px;
      line-height: 130px;
    }

    /* Date line */
    .since-line {
      margin-top: 36px;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }
    .since-line span {
      color: rgba(255,255,255,0.6);
    }

    /* Label badge */
    .version-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      font-size: 0.65rem;
      letter-spacing: 2px;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="version-badge">V1 — Floating Cards</div>
<div class="stars" id="stars"></div>

<section class="counter-section">
  <div class="days-label">Days of Us</div>
  <div class="days-sublabel">since May 5, 2025</div>

  <div class="counter-container">
    <div class="counter">
      <span class="num" id="days">0</span>
      <span class="label">Days</span>
    </div>
    <div class="sep">:</div>
    <div class="counter">
      <span class="num" id="hours">0</span>
      <span class="label">Hours</span>
    </div>
    <div class="sep">:</div>
    <div class="counter">
      <span class="num" id="minutes">0</span>
      <span class="label">Minutes</span>
    </div>
    <div class="sep">:</div>
    <div class="counter">
      <span class="num" id="seconds">0</span>
      <span class="label">Seconds</span>
    </div>
  </div>

  <div class="since-line">Started <span>May 5, 2025</span> · Still counting ♥</div>
</section>

<script>
  // Starfield
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--o:${(Math.random()*0.7+0.15).toFixed(2)};animation-delay:${(Math.random()*4).toFixed(1)}s`;
    starsEl.appendChild(s);
  }

  // Counter
  const start = new Date('2025-05-05T00:00:00');
  function update() {
    const diff = Date.now() - start;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('days').textContent    = String(d).padStart(2,'0');
    document.getElementById('hours').textContent   = String(h).padStart(2,'0');
    document.getElementById('minutes').textContent = String(m).padStart(2,'0');
    document.getElementById('seconds').textContent = String(s).padStart(2,'0');
  }
  update();
  setInterval(update, 1000);
</script>
</body>
</html>
