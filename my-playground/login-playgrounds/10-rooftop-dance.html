<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story — Rooftop Dance</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
      background: #03050f;
    }

    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg,
        #010208 0%,
        #04091a 20%,
        #070d24 40%,
        #0e142e 60%,
        #141828 80%,
        #1a1c2a 100%
      );
    }

    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: var(--lo); }
      to   { opacity: var(--hi); }
    }

    .skyline {
      position: fixed;
      bottom: 18%; left: 0;
      width: 100%; height: 260px;
      pointer-events: none;
    }
    .skyline svg { width: 100%; height: 100%; }

    .rooftop {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 20%;
    }
    .rooftop svg { width: 100%; height: 100%; }

    .string-lights { position: fixed; top: 5%; left: 0; width: 100%; pointer-events: none; z-index: 5; }

    .couple {
      position: fixed;
      bottom: 19%; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .glow {
      position: fixed;
      bottom: 18%; left: 50%;
      transform: translateX(-50%);
      width: 180px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,200,100,0.12) 0%, transparent 70%);
      z-index: 8;
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

    .note {
      position: fixed;
      font-size: 1.2rem;
      animation: floatNote var(--dur) ease-in-out infinite;
      opacity: 0;
      color: rgba(255,200,100,0.5);
      z-index: 12;
    }
    @keyframes floatNote {
      0%   { transform: translateY(0) translateX(0) rotate(0deg);  opacity: 0; }
      15%  { opacity: var(--op); }
      85%  { opacity: var(--op); }
      100% { transform: translateY(var(--rise)) translateX(var(--sway)) rotate(var(--rot)); opacity: 0; }
    }

    .card {
      position: relative; z-index: 20;
      background: rgba(8,10,24,0.65);
      border: 1px solid rgba(255,200,100,0.2);
      border-radius: 24px;
      padding: 44px 42px;
      width: 360px;
      backdrop-filter: blur(22px);
      box-shadow: 0 12px 64px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,200,100,0.1);
      text-align: center;
    }
    .memory-tag {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,200,100,0.6);
      border: 1px solid rgba(255,200,100,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 22px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 400;
      color: #f0e8d0;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .date {
      font-size: 0.73rem;
      color: rgba(200,170,100,0.55);
      letter-spacing: 0.14em;
      margin-bottom: 26px;
    }
    .quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: rgba(240,220,180,0.7);
      line-height: 1.75;
      margin-bottom: 30px;
      padding: 0 6px;
    }
    .photo-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .photo-box {
      width: 72px; height: 52px;
      border-radius: 8px;
      background: rgba(255,200,100,0.08);
      border: 1px solid rgba(255,200,100,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      opacity: 0.7;
    }
    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-primary {
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #b8860b, #ffd700);
      color: #0a0808;
      border: none;
      border-radius: 30px;
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      font-weight: 400;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-ghost {
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: none;
      color: rgba(200,170,100,0.65);
      border: 1px solid rgba(200,170,100,0.25);
      border-radius: 30px;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-ghost:hover { background: rgba(200,170,100,0.08); }
  </style>
</head>
<body>

<div class="sky"></div>
<div class="stars" id="stars"></div>

<div class="skyline">
  <svg viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0"    y="140" width="60"  height="120" fill="#080c1a"/>
    <rect x="15"   y="120" width="30"  height="20"  fill="#080c1a"/>
    <rect x="60"   y="100" width="80"  height="160" fill="#0a0f1e"/>
    <rect x="80"   y="80"  width="40"  height="20"  fill="#0a0f1e"/>
    <rect x="140"  y="130" width="55"  height="130" fill="#080c1a"/>
    <rect x="195"  y="110" width="70"  height="150" fill="#0d1220"/>
    <rect x="220"  y="60"  width="20"  height="50"  fill="#0d1220"/>
    <rect x="265"  y="80"  width="90"  height="180" fill="#080c1a"/>
    <rect x="290"  y="40"  width="40"  height="40"  fill="#080c1a"/>
    <rect x="415"  y="90"  width="50"  height="170" fill="#080c1a"/>
    <rect x="465"  y="70"  width="80"  height="190" fill="#0d1220"/>
    <rect x="480"  y="30"  width="50"  height="40"  fill="#0d1220"/>
    <rect x="545"  y="50"  width="100" height="210" fill="#080c1a"/>
    <rect x="565"  y="10"  width="60"  height="40"  fill="#080c1a"/>
    <rect x="645"  y="60"  width="90"  height="200" fill="#0a0f1e"/>
    <rect x="660"  y="20"  width="60"  height="40"  fill="#0a0f1e"/>
    <rect x="805"  y="70"  width="85"  height="190" fill="#0d1220"/>
    <rect x="820"  y="35"  width="55"  height="35"  fill="#0d1220"/>
    <rect x="950"  y="85"  width="75"  height="175" fill="#0a0f1e"/>
    <rect x="965"  y="50"  width="45"  height="35"  fill="#0a0f1e"/>
    <rect x="1080" y="90"  width="80"  height="170" fill="#0d1220"/>
    <rect x="1095" y="55"  width="50"  height="35"  fill="#0d1220"/>
    <rect x="1280" y="100" width="70"  height="160" fill="#080c1a"/>
    <rect x="1350" y="140" width="90"  height="120" fill="#0d1220"/>
  </svg>
</div>

<canvas id="cityCanvas" style="position:fixed;bottom:18%;left:0;width:100%;height:260px;pointer-events:none;z-index:2;"></canvas>

<div class="rooftop">
  <svg viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1440" height="180" fill="#0e1020"/>
    <rect x="0"    y="0" width="8" height="40" fill="#1a1e30"/>
    <rect x="100"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="200"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="300"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="400"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="500"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="600"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="700"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="800"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="900"  y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="1000" y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="1100" y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="1200" y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="1300" y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="1400" y="0" width="6" height="40" fill="#1a1e30"/>
    <rect x="0" y="0" width="1440" height="8" fill="#222640"/>
    <line x1="0" y1="60"  x2="1440" y2="60"  stroke="#161828" stroke-width="1"/>
    <line x1="0" y1="100" x2="1440" y2="100" stroke="#161828" stroke-width="1"/>
    <line x1="0" y1="140" x2="1440" y2="140" stroke="#161828" stroke-width="1"/>
  </svg>
</div>

<svg class="string-lights" viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" height="80">
  <path d="M0,20 Q180,45 360,25 Q540,5 720,30 Q900,55 1080,28 Q1260,5 1440,22" stroke="#4a3a10" stroke-width="1.5" fill="none"/>
  <path d="M0,12 Q200,38 400,18 Q600,-2 800,22 Q1000,46 1200,20 Q1320,8 1440,14" stroke="#4a3a10" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
<div id="lightBulbs"></div>

<div class="glow"></div>

<svg class="couple" width="110" height="100" viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg" fill="#0c0e18">
  <circle cx="34" cy="16" r="8"/>
  <path d="M34,24 Q24,36 20,58 Q22,64 28,62 Q32,54 34,48 Q36,54 42,60 Q46,62 48,56 Q44,36 34,24Z"/>
  <path d="M34,32 Q26,28 20,22" stroke="#0c0e18" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M34,32 Q44,26 52,30" stroke="#0c0e18" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="18" r="7.5"/>
  <path d="M72,26 Q64,38 62,58 Q64,65 68,63 Q72,55 72,48 Q72,55 77,63 Q81,65 83,58 Q82,38 72,26Z"/>
  <path d="M72,33 Q62,28 52,30" stroke="#0c0e18" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M72,33 Q80,30 86,26" stroke="#0c0e18" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>

<div id="notes"></div>

<div class="card">
  <span class="memory-tag">✦ A Memory ✦</span>
  <h1>Our First Dance</h1>
  <div class="date">July 22 · Rooftop, Downtown</div>
  <p class="quote">"The city hummed below us and nothing else existed — just you, and the song, and the way the lights looked in your eyes."</p>
  <div class="photo-strip">
    <div class="photo-box">🌃</div>
    <div class="photo-box">💃</div>
    <div class="photo-box">🌟</div>
  </div>
  <div class="action-row">
    <button class="btn-primary">Save Memory</button>
    <button class="btn-ghost">Next →</button>
  </div>
</div>

<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 180; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `
      left:${Math.random()*100}%;top:${Math.random()*60}%;
      width:${size}px;height:${size}px;
      --lo:${(Math.random()*0.2+0.05).toFixed(2)};
      --hi:${(Math.random()*0.6+0.4).toFixed(2)};
      --d:${(Math.random()*4+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  const canvas = document.getElementById('cityCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = 260;
  const wColors = ['rgba(255,230,130,0.7)','rgba(255,200,80,0.5)','rgba(200,220,255,0.5)','rgba(255,255,200,0.6)'];
  for (let i = 0; i < 280; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * 200;
    const w = Math.random() * 5 + 2;
    const h = Math.random() * 6 + 3;
    ctx.fillStyle = wColors[Math.floor(Math.random()*wColors.length)];
    if (Math.random() > 0.25) ctx.fillRect(x, y, w, h);
  }

  const bulbEl = document.getElementById('lightBulbs');
  const pts = [[0,20],[180,45],[360,25],[540,5],[720,30],[900,55],[1080,28],[1260,5],[1440,22]];
  const vw = window.innerWidth;
  pts.forEach(([px, py]) => {
    const b = document.createElement('div');
    const lx = (px / 1440) * vw;
    b.style.cssText = `
      position:fixed;
      left:${lx}px;top:${py * 0.12 + 5}%;
      width:7px;height:9px;
      border-radius:50% 50% 45% 45%;
      background:radial-gradient(ellipse, #ffe87a, #ffc200);
      box-shadow:0 0 6px 3px rgba(255,210,80,0.55),0 0 18px 6px rgba(255,180,40,0.2);
      z-index:6;pointer-events:none;
    `;
    bulbEl.appendChild(b);
  });

  const noteEl = document.getElementById('notes');
  const noteChars = ['♩','♪','♫','♬'];
  for (let i = 0; i < 12; i++) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = noteChars[Math.floor(Math.random()*noteChars.length)];
    n.style.cssText = `
      left:${40 + Math.random()*20}%;
      bottom:${22 + Math.random()*10}%;
      --dur:${(Math.random()*4+4).toFixed(1)}s;
      --rise:-${(Math.random()*80+40).toFixed(0)}px;
      --sway:${((Math.random()-0.5)*60).toFixed(0)}px;
      --rot:${((Math.random()-0.5)*40).toFixed(0)}deg;
      --op:${(Math.random()*0.4+0.2).toFixed(2)};
      animation-delay:${(Math.random()*6).toFixed(1)}s;
    `;
    noteEl.appendChild(n);
  }
</script>
</body>
</html>
