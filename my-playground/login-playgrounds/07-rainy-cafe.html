<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rainy Café</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
      background: #1a1008;
    }

    .interior {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 25% 40%, rgba(255,160,40,0.22) 0%, transparent 70%),
                  radial-gradient(ellipse 40% 40% at 75% 60%, rgba(255,120,20,0.15) 0%, transparent 70%),
                  linear-gradient(160deg, #1a1208 0%, #2a1a06 40%, #1e1204 100%);
    }

    .lights { position: fixed; top: 0; left: 0; width: 100%; }
    .bulb-wrap { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; }
    .cord { width: 1px; background: rgba(200,160,80,0.35); }
    .bulb {
      width: 14px; height: 18px;
      border-radius: 50% 50% 40% 40%;
      background: radial-gradient(ellipse at 40% 35%, #fff8e0 0%, #ffcc44 40%, #ff8800 100%);
      box-shadow: 0 0 12px 8px rgba(255,180,40,0.55), 0 0 40px 20px rgba(255,140,20,0.2);
      animation: flicker var(--fk) ease-in-out infinite alternate;
    }
    @keyframes flicker {
      from { opacity: 0.85; box-shadow: 0 0 12px 8px rgba(255,180,40,0.55), 0 0 40px 20px rgba(255,140,20,0.2); }
      to   { opacity: 1;    box-shadow: 0 0 16px 10px rgba(255,190,60,0.7), 0 0 60px 28px rgba(255,160,30,0.3); }
    }

    .window-frame { position: fixed; inset: 0; background: transparent; pointer-events: none; }
    .window-frame::before, .window-frame::after {
      content: ''; position: absolute; background: rgba(80,50,20,0.5);
    }
    .window-frame::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
    .window-frame::after  { top: 42%; left: 0; right: 0; height: 6px; transform: translateY(-50%); }

    canvas#rain { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

    .drop {
      position: fixed;
      border-radius: 50% 50% 55% 45%;
      background: rgba(200,220,240,0.18);
      border: 1px solid rgba(200,220,240,0.25);
      animation: drip var(--dr) ease-in var(--delay) infinite;
    }
    @keyframes drip {
      0%   { transform: translateY(0) scaleY(1); opacity: 0.6; }
      70%  { transform: translateY(var(--dropy)) scaleY(1.2); opacity: 0.5; }
      100% { transform: translateY(calc(var(--dropy) * 1.4)) scaleY(0.8); opacity: 0; }
    }

    .bokeh { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .bk {
      position: absolute; border-radius: 50%; filter: blur(18px);
      animation: drift var(--dd) ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0,0); }
      to   { transform: translate(var(--bx), var(--by)); }
    }

    .card {
      position: relative; z-index: 20;
      background: rgba(30, 18, 8, 0.78);
      border: 1px solid rgba(255, 160, 40, 0.22);
      border-radius: 20px;
      padding: 44px 40px;
      width: 340px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,180,60,0.1);
    }

    .tagline {
      font-family: 'Playfair Display', serif; font-style: italic;
      color: rgba(255,190,80,0.7); font-size: 0.8rem;
      letter-spacing: 0.1em; text-align: center; margin-bottom: 24px;
    }
    h1 {
      font-family: 'Playfair Display', serif; font-size: 1.7rem;
      font-weight: 400; color: #f5e8d0; text-align: center; margin-bottom: 6px;
    }
    .sub {
      font-size: 0.78rem; color: rgba(200,160,100,0.55);
      text-align: center; margin-bottom: 34px; letter-spacing: 0.08em;
    }
    label {
      display: block; font-size: 0.72rem; color: rgba(200,160,100,0.7);
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 7px;
    }
    input {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,160,40,0.2); border-radius: 10px;
      padding: 12px 14px; color: #f0e0c0; font-size: 0.9rem;
      font-family: 'Lato', sans-serif; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; margin-bottom: 18px;
    }
    input:focus { border-color: rgba(255,160,40,0.5); box-shadow: 0 0 0 3px rgba(255,140,20,0.08); }
    input::placeholder { color: rgba(200,140,80,0.3); }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #7a4510 0%, #c4721a 100%);
      color: #fff5e0; font-size: 0.9rem; font-family: 'Lato', sans-serif;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s; margin-top: 4px;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    .footer { text-align: center; margin-top: 22px; font-size: 0.75rem; color: rgba(200,150,80,0.4); }
    .footer a { color: rgba(255,180,60,0.55); text-decoration: none; }
    .footer a:hover { color: rgba(255,180,60,0.85); }
  </style>
</head>
<body>

<div class="interior"></div>
<div class="bokeh" id="bokeh"></div>
<div class="lights" id="lights"></div>
<canvas id="rain"></canvas>
<div class="window-frame"></div>
<div id="drops"></div>

<div class="card">
  <div class="tagline">☕ warm inside while it pours ☕</div>
  <h1>Nice to Meet You</h1>
  <p class="sub">Sign in to your story</p>

  <label>Email</label>
  <input type="email" placeholder="your@email.com" autocomplete="off">

  <label>Password</label>
  <input type="password" placeholder="••••••••">

  <button>Come Inside</button>

  <div class="footer">
    No account? <a href="#">Start your story</a>
  </div>
</div>

<script>
  const lightsEl = document.getElementById('lights');
  [8, 22, 37, 52, 65, 78, 90].forEach(x => {
    const wrap = document.createElement('div');
    wrap.className = 'bulb-wrap';
    wrap.style.left = x + '%';
    wrap.innerHTML = `
      <div class="cord" style="height:${Math.random()*60+40}px"></div>
      <div class="bulb" style="--fk:${(Math.random()*1.5+1).toFixed(1)}s;animation-delay:${(Math.random()*2).toFixed(1)}s"></div>
    `;
    lightsEl.appendChild(wrap);
  });

  const bokehEl = document.getElementById('bokeh');
  const bkColors = ['rgba(255,160,40,0.12)','rgba(255,100,20,0.1)','rgba(255,200,80,0.08)','rgba(220,80,20,0.09)'];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bk';
    const sz = Math.random() * 120 + 60;
    b.style.cssText = `
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${sz}px;height:${sz}px;
      background:${bkColors[Math.floor(Math.random()*bkColors.length)]};
      --dd:${(Math.random()*5+4).toFixed(1)}s;
      --bx:${((Math.random()-0.5)*60).toFixed(0)}px;
      --by:${((Math.random()-0.5)*40).toFixed(0)}px;
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    bokehEl.appendChild(b);
  }

  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let W, H;
  const rainDrops = [];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 180; i++) {
    rainDrops.push({
      x: Math.random() * 1600 - 100,
      y: Math.random() * (typeof H !== 'undefined' ? H : 800),
      len: Math.random() * 18 + 8,
      speed: Math.random() * 6 + 8,
      alpha: Math.random() * 0.25 + 0.08,
      thick: Math.random() * 0.8 + 0.3,
    });
  }

  function drawRain() {
    ctx.clearRect(0, 0, W, H);
    rainDrops.forEach(d => {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.len * 0.22, d.y + d.len);
      ctx.strokeStyle = `rgba(180,210,240,${d.alpha})`;
      ctx.lineWidth = d.thick;
      ctx.stroke();
      d.x += d.speed * 0.22;
      d.y += d.speed;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * (W + 200) - 100; }
    });
    requestAnimationFrame(drawRain);
  }
  drawRain();

  const dropsEl = document.getElementById('drops');
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    const sz = Math.random() * 8 + 4;
    d.style.cssText = `
      left:${Math.random()*98}%;top:${Math.random()*80}%;
      width:${sz}px;height:${(sz*1.3).toFixed(1)}px;
      --dr:${(Math.random()*4+3).toFixed(1)}s;
      --delay:${(Math.random()*6).toFixed(1)}s;
      --dropy:${Math.floor(Math.random()*80+20)}px;
    `;
    dropsEl.appendChild(d);
  }
</script>
</body>
</html>
