<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Love Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5ede0;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(200,160,90,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(180,130,60,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .heart {
      position: fixed;
      opacity: 0;
      animation: floatUp linear infinite;
      pointer-events: none;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.6) rotate(-10deg); }
      15%  { opacity: 0.55; }
      80%  { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(-60vh) scale(1.1) rotate(10deg); }
    }

    .envelope-top {
      width: 100%;
      height: 60px;
      background: #e8d5b0;
      border-bottom: 2px solid #c9a96e;
      border-radius: 20px 20px 0 0;
      position: relative;
      overflow: hidden;
    }
    .envelope-top::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 60px;
      background: #d4b88a;
      clip-path: polygon(0 0, 50% 90%, 100% 0);
    }

    .card {
      width: 440px;
      background: #fffef7;
      border-radius: 20px;
      box-shadow:
        0 2px 0 #c9a96e,
        0 4px 0 rgba(180,140,80,0.3),
        0 12px 40px rgba(150,100,40,0.18),
        4px 4px 20px rgba(0,0,0,0.06);
      overflow: hidden;
      border: 1px solid #e0c990;
    }

    .card-body {
      padding: 36px 44px 44px;
      text-align: center;
      background-image: repeating-linear-gradient(transparent, transparent 27px, #e8dfc8 28px);
      background-size: 100% 28px;
      background-position: 0 16px;
    }

    .wax-seal { font-size: 2.2rem; display: block; margin-bottom: 14px; filter: drop-shadow(2px 2px 4px rgba(150,80,40,0.35)); }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.1rem;
      color: #7a3d10;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .subtitle { font-size: 0.85rem; color: #b08040; font-style: italic; margin-bottom: 30px; }

    .field { margin-bottom: 22px; text-align: left; }

    .field label {
      font-family: 'Dancing Script', cursive;
      font-size: 1rem;
      color: #9b5c20;
      display: block;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,250,235,0.7);
      border: none;
      border-bottom: 2px solid #d4a866;
      font-size: 1rem;
      color: #5a3010;
      outline: none;
      transition: border-color 0.25s;
      font-family: 'EB Garamond', serif;
    }
    .field input::placeholder { color: #c8aa78; font-style: italic; }
    .field input:focus { border-color: #a0622a; background: rgba(255,245,210,0.8); }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #8b2500;
      color: #fff8ec;
      border: none;
      border-radius: 8px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.35rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 16px rgba(139,37,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn:hover { background: #a02d00; transform: translateY(-1px); }

    .ps { font-style: italic; font-size: 0.82rem; color: #b08040; margin-top: 18px; }
    .ps a { color: #8b4513; }

    .sign { font-family: 'Dancing Script', cursive; font-size: 1.1rem; color: #9b5c20; margin-top: 20px; }
  </style>
</head>
<body>

<div class="card">
  <div class="envelope-top"></div>
  <div class="card-body">
    <span class="wax-seal">💌</span>
    <h1>My Dearest,</h1>
    <p class="subtitle">A letter written just for you</p>

    <div class="field">
      <label>Your email address,</label>
      <input type="email" placeholder="your@email.com...">
    </div>

    <div class="field">
      <label>Our secret,</label>
      <input type="password" placeholder="••••••••">
    </div>

    <button class="btn">Seal With a Kiss ♥</button>

    <p class="sign">Yours truly, forever ~</p>
    <p class="ps">First time writing? <a href="#">Compose a new letter</a></p>
  </div>
</div>

<script>
  const hearts = ['❤️','🧡','💛','💗','💕','💓','♥'];
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.cssText = `
      left:${Math.random()*100}vw;
      bottom:${Math.random()*15}vh;
      font-size:${0.7+Math.random()*0.8}rem;
      animation-duration:${5+Math.random()*8}s;
      animation-delay:${-Math.random()*10}s;
    `;
    document.body.appendChild(h);
  }
</script>
</body>
</html>
