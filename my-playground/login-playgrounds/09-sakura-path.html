<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story — Sakura Path</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
    }

    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg,
        #1a0a2e 0%,
        #3d1a5c 18%,
        #7a2d6b 36%,
        #c45e82 55%,
        #e8a0a8 72%,
        #f5cfc5 88%,
        #fde8e0 100%
      );
    }

    .mountains {
      position: fixed;
      bottom: 32%; left: 0;
      width: 100%; height: 280px;
      pointer-events: none;
    }
    .mountains svg { width: 100%; height: 100%; }

    .ground {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 34%;
    }
    .ground svg { width: 100%; height: 100%; }

    .tree-left, .tree-right {
      position: fixed;
      bottom: 30%;
      width: 220px;
      height: auto;
    }
    .tree-left  { left: -30px; }
    .tree-right { right: -30px; transform: scaleX(-1); }

    .couple {
      position: fixed;
      bottom: 32%; left: 50%;
      transform: translateX(-50%);
      width: 80px;
      opacity: 0.88;
    }

    .petal {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      animation: fall var(--dur) ease-in var(--delay) infinite;
    }
    @keyframes fall {
      0%   { transform: translateX(0) rotate(0deg); opacity: 0; top: -20px; }
      5%   { opacity: var(--op); }
      90%  { opacity: var(--op); }
      100% { transform: translateX(var(--drift)) rotate(var(--spin)); opacity: 0; top: 108vh; }
    }

    .moon {
      position: fixed;
      top: 8%; right: 12%;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #fff5f0, #f8d0c0);
      box-shadow: 0 0 30px 12px rgba(248,208,180,0.35), 0 0 80px 30px rgba(248,208,180,0.12);
    }

    .card {
      position: relative; z-index: 20;
      background: rgba(255,240,245,0.18);
      border: 1px solid rgba(255,180,200,0.35);
      border-radius: 24px;
      padding: 46px 42px;
      width: 360px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 60px rgba(80,10,40,0.25), inset 0 1px 0 rgba(255,220,230,0.3);
      text-align: center;
    }
    .chapter-label {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,120,140,0.8);
      margin-bottom: 18px;
    }
    .chapter-label span {
      display: inline-block;
      width: 28px; height: 1px;
      background: rgba(200,120,140,0.5);
      vertical-align: middle;
      margin: 0 8px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      color: #2a0a1c;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .date {
      font-size: 0.75rem;
      color: rgba(120,50,70,0.65);
      letter-spacing: 0.14em;
      margin-bottom: 28px;
    }
    .quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(50,10,25,0.75);
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid rgba(200,140,160,0.3); }
    .divider span { font-size: 1rem; opacity: 0.7; }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(160,60,90,0.75);
      background: none;
      border: 1px solid rgba(200,120,140,0.3);
      border-radius: 30px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .nav-btn:hover { background: rgba(200,120,140,0.12); color: rgba(160,40,70,1); }
    .chapter-dot { display: flex; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(200,120,140,0.3); }
    .dot.active { background: rgba(180,60,90,0.7); }
  </style>
</head>
<body>

<div class="sky"></div>
<div class="moon"></div>

<div class="mountains">
  <svg viewBox="0 0 1440 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,280 L0,180 Q100,120 200,160 Q280,190 360,120 Q440,50 560,100 Q640,130 720,70 Q800,10 900,60 Q980,100 1080,80 Q1160,65 1260,100 Q1350,130 1440,110 L1440,280 Z" fill="rgba(80,30,60,0.3)"/>
    <path d="M0,280 L0,210 Q120,160 240,190 Q340,215 440,170 Q520,135 620,165 Q720,195 840,155 Q960,115 1080,150 Q1200,185 1440,160 L1440,280 Z" fill="rgba(120,50,80,0.25)"/>
  </svg>
</div>

<svg class="tree-left" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="220" width="18" height="100" fill="#3a1a28" rx="4"/>
  <path d="M110,220 Q70,200 50,170 Q30,140 60,130 Q40,110 70,105 Q55,80 85,80 Q80,55 108,58 Q106,30 120,40 Q134,30 132,58 Q160,55 155,80 Q185,80 170,105 Q200,110 180,130 Q210,140 190,170 Q170,200 150,220 Z" fill="#c45e82" opacity="0.85"/>
  <path d="M110,220 Q75,195 58,162 Q80,168 100,155 Q120,142 140,155 Q162,168 162,162 Q145,195 110,220 Z" fill="#e8a0b8" opacity="0.6"/>
</svg>

<svg class="tree-right" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="220" width="18" height="100" fill="#3a1a28" rx="4"/>
  <path d="M110,220 Q70,200 50,170 Q30,140 60,130 Q40,110 70,105 Q55,80 85,80 Q80,55 108,58 Q106,30 120,40 Q134,30 132,58 Q160,55 155,80 Q185,80 170,105 Q200,110 180,130 Q210,140 190,170 Q170,200 150,220 Z" fill="#c45e82" opacity="0.85"/>
  <path d="M110,220 Q75,195 58,162 Q80,168 100,155 Q120,142 140,155 Q162,168 162,162 Q145,195 110,220 Z" fill="#e8a0b8" opacity="0.6"/>
</svg>

<div class="ground">
  <svg viewBox="0 0 1440 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="720" cy="20"  rx="38" ry="10" fill="rgba(200,160,170,0.4)"/>
    <ellipse cx="700" cy="60"  rx="50" ry="13" fill="rgba(190,150,160,0.45)"/>
    <ellipse cx="715" cy="110" rx="65" ry="17" fill="rgba(180,140,155,0.5)"/>
    <ellipse cx="720" cy="175" rx="90" ry="22" fill="rgba(170,130,148,0.5)"/>
    <ellipse cx="720" cy="250" rx="130" ry="28" fill="rgba(160,120,140,0.4)"/>
    <path d="M0,300 L0,100 Q360,60 720,80 Q1080,60 1440,100 L1440,300 Z" fill="#3a1a28" opacity="0.7"/>
    <path d="M0,300 L0,150 Q360,110 720,130 Q1080,110 1440,150 L1440,300 Z" fill="#2a0e1c" opacity="0.6"/>
  </svg>
</div>

<svg class="couple" viewBox="0 0 80 70" xmlns="http://www.w3.org/2000/svg" fill="#1a0a12">
  <circle cx="25" cy="14" r="6.5"/>
  <path d="M25,21 Q18,32 20,48 Q22,56 25,56 Q28,56 30,48 Q32,32 25,21Z"/>
  <path d="M25,30 Q16,34 13,43" stroke="#1a0a12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M25,30 Q34,32 39,36" stroke="#1a0a12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="16" r="6"/>
  <path d="M52,22 Q45,33 47,48 Q49,56 52,56 Q55,56 57,48 Q59,33 52,22Z"/>
  <path d="M52,31 Q43,32 39,36" stroke="#1a0a12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M52,31 Q61,35 64,43" stroke="#1a0a12" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>

<div id="petals"></div>

<div class="card">
  <div class="chapter-label"><span></span>Chapter One<span></span></div>
  <h1>The Day We Met</h1>
  <div class="date">March 14 · Spring, Two Years Ago</div>
  <p class="quote">"You walked down a path lined with sakura and I forgot every word I had ever known."</p>
  <div class="divider"><hr><span>🌸</span><hr></div>
  <div class="nav-row">
    <button class="nav-btn">← Before</button>
    <div class="chapter-dot">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <button class="nav-btn">After →</button>
  </div>
</div>

<script>
  const petalEl = document.getElementById('petals');
  const shapes = [
    'M10,0 Q16,4 12,10 Q8,14 4,10 Q0,4 6,0 Q8,-2 10,0Z',
    'M8,0 Q14,3 11,9 Q8,13 3,9 Q0,4 5,0 Q6,-1 8,0Z',
    'M6,0 Q12,5 8,11 Q4,14 1,8 Q-1,2 5,0 Q5.5,-0.5 6,0Z',
  ];
  const pinks = ['#f5a8c0','#f0c0d0','#e890b0','#fbd0de','#f2b0c8'];
  for (let i = 0; i < 55; i++) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    const size = Math.random() * 14 + 7;
    svg.setAttribute('viewBox', '-2 -2 18 18');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.style.cssText = `
      position:fixed;
      left:${Math.random()*104-2}%;
      top:-20px;
      --dur:${(Math.random()*9+7).toFixed(1)}s;
      --delay:${(Math.random()*12).toFixed(1)}s;
      --drift:${((Math.random()-0.5)*200).toFixed(0)}px;
      --spin:${(Math.random()*720-360).toFixed(0)}deg;
      --op:${(Math.random()*0.5+0.35).toFixed(2)};
      pointer-events:none;
    `;
    svg.classList.add('petal');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', shapes[Math.floor(Math.random()*shapes.length)]);
    path.setAttribute('fill', pinks[Math.floor(Math.random()*pinks.length)]);
    svg.appendChild(path);
    petalEl.appendChild(svg);
  }
</script>
</body>
</html>
