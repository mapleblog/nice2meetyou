<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Section v1 – Glassmorphism</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Floating blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: #6c5ce7; top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: #fd79a8; bottom: -80px; right: 10%; animation-delay: -4s; }
    .blob-3 { width: 250px; height: 250px; background: #00cec9; top: 40%; left: 60%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Layout */
    .friendship-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .avatars {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Avatar */
    .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      overflow: hidden;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.06), 0 12px 40px rgba(0,0,0,0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .avatar:hover { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(108,92,231,0.3), 0 16px 50px rgba(0,0,0,0.5); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .name-display {
      color: rgba(255,255,255,0.9);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Glassmorphism card */
    .profile-canvas {
      width: 240px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .profile-canvas:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(108,92,231,0.3);
    }
    .profile-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    /* Rainbow top line */
    .profile-canvas::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff9a9e, #a18cd1, #84fab0, #8fd3f4, #fbc2eb);
      background-size: 300% 100%;
      animation: gradientFlow 6s linear infinite;
      border-radius: 20px 20px 0 0;
    }
    @keyframes gradientFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile-info {
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .info-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .info-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(108,92,231,0.25);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.9);
      font-size: 0.9rem;
      box-shadow: 0 0 10px rgba(108,92,231,0.3);
    }
    .info-text { font-size: 0.75rem; color: rgba(255,255,255,0.75); font-weight: 600; }

    .profile-interests { margin-bottom: 16px; text-align: center; }
    .profile-interests h4 {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .tag {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.25s ease;
    }
    .tag:hover {
      background: rgba(108,92,231,0.3);
      border-color: rgba(108,92,231,0.5);
      transform: translateY(-2px);
    }

    .profile-motto {
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.65);
      font-style: italic;
      padding: 4px 8px;
      line-height: 1.5;
    }

    /* Heart connector */
    .heart-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 50px;
    }
    .heart { color: #fd79a8; font-size: 2rem; animation: heartbeat 1.4s ease-in-out infinite; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.2); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <section class="friendship-section">
    <div class="avatars">

      <!-- Person 1 -->
      <div class="avatar-container">
        <div class="avatar">
          <img src="../img/profile1.jpg" alt="啊康">
        </div>
        <div class="name-display">啊康</div>
        <div class="profile-canvas">
          <div class="profile-info">
            <div class="info-item">
              <span class="info-icon"><i class="fas fa-birthday-cake"></i></span>
              <span class="info-text">1991-02-28</span>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fas fa-globe-asia"></i></span>
              <span class="info-text">马来西亚</span>
            </div>
          </div>
          <div class="profile-interests">
            <h4>兴趣爱好</h4>
            <div class="profile-tags">
              <span class="tag">旅行</span>
              <span class="tag">摄影</span>
              <span class="tag">美食</span>
            </div>
          </div>
          <div class="profile-motto">"生活不止眼前的苏豆和试卷"</div>
        </div>
      </div>

      <!-- Heart -->
      <div class="heart-container">
        <div class="heart"><i class="fas fa-heart"></i></div>
      </div>

      <!-- Person 2 -->
      <div class="avatar-container">
        <div class="avatar">
          <img src="../img/profile.png" alt="啊庄">
        </div>
        <div class="name-display">啊庄</div>
        <div class="profile-canvas">
          <div class="profile-info">
            <div class="info-item">
              <span class="info-icon"><i class="fas fa-birthday-cake"></i></span>
              <span class="info-text">2000-01-18</span>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fas fa-globe-asia"></i></span>
              <span class="info-text">越南</span>
            </div>
          </div>
          <div class="profile-interests">
            <h4>兴趣爱好</h4>
            <div class="profile-tags">
              <span class="tag">音乐</span>
              <span class="tag">阅读</span>
              <span class="tag">电影</span>
            </div>
          </div>
          <div class="profile-motto">"人生就像弦一样，不绕紧就弹不出美妙的音乐"</div>
        </div>
      </div>

    </div>
  </section>
</body>
</html>
