<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Bar — Cherry Blossom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }

    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg,
        #2a0a3e 0%, #5c1e6e 20%, #9c3e7e 40%,
        #d47090 58%, #f0aab0 74%, #fad8d0 88%, #feeee8 100%);
    }
    .tree { position: fixed; bottom: 78px; pointer-events: none; }
    .tree-l { left: -20px; }
    .tree-r { right: -20px; transform: scaleX(-1); }

    .petal {
      position: fixed; pointer-events: none; opacity: 0;
      animation-name: pfall; animation-timing-function: ease-in;
      animation-iteration-count: infinite;
      animation-duration: var(--dur); animation-delay: var(--delay);
    }
    @keyframes pfall {
      0%   { top:-16px; transform:translateX(0) rotate(0deg); opacity:0; }
      5%   { opacity:var(--op); }
      92%  { opacity:var(--op); }
      100% { top:108vh; transform:translateX(var(--drift)) rotate(var(--spin)); opacity:0; }
    }

    .ground { position: fixed; bottom: 0; left: 0; width: 100%; pointer-events: none; }
    .ground svg { display: block; width: 100%; }

    .couple {
      position: fixed; bottom: 155px; left: 50%; transform: translateX(-50%);
      text-align: center; pointer-events: none;
    }
    .cname {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.3rem; color: rgba(60,10,30,0.42); letter-spacing: 0.05em;
    }
    .cheart { font-size: 0.9rem; color: rgba(180,60,100,0.32); display: block; margin: 5px 0; }

    /* ── Bar ── */
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 78px;
      background: rgba(255, 240, 246, 0.58);
      border-top: 1px solid rgba(220,140,160,0.28);
      backdrop-filter: blur(26px) saturate(1.9);
      box-shadow: 0 -4px 28px rgba(180,80,100,0.1), inset 0 1px 0 rgba(255,220,232,0.55);
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      align-items: center;
      padding: 0 24px; gap: 16px; z-index: 100;
    }
    .prog-strip {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: rgba(210,110,140,0.1); cursor: pointer;
    }
    .prog-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #be185d, #f43f5e);
      transition: width 0.35s linear; position: relative;
    }
    .prog-fill::after {
      content: ''; position: absolute; right: -4px; top: -3px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #fb7185; box-shadow: 0 0 8px rgba(251,113,133,0.65);
    }

    .bl { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .art-box {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, #fce7f3, #fbcfe8 45%, #f9a8d4 75%, #f472b6);
      box-shadow: 0 4px 14px rgba(244,114,182,0.32);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; position: relative; overflow: hidden;
    }
    .art-box::after {
      content: ''; position: absolute; inset: 0; border-radius: 12px;
      border: 2px solid transparent;
      transition: border-color 0.4s;
    }
    .art-box.playing::after { border-color: rgba(244,114,182,0.55); }
    .ti { min-width: 0; }
    .ti-title {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 0.9rem; color: #5a1030;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ti-artist {
      font-size: 0.66rem; color: rgba(150,55,85,0.52);
      letter-spacing: 0.09em; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fav-btn {
      background: none; border: none; cursor: pointer; flex-shrink: 0;
      font-size: 1rem; color: rgba(200,80,120,0.28);
      transition: color 0.2s, transform 0.15s; padding: 4px;
    }
    .fav-btn:hover { color: #f43f5e; transform: scale(1.2); }
    .fav-btn.on { color: #f43f5e; }

    .bc { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .sk-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.88rem; color: rgba(180,70,110,0.42);
      padding: 8px; transition: color 0.2s, transform 0.14s; line-height: 1;
    }
    .sk-btn:hover { color: #be185d; transform: scale(1.12); }
    .pl-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(145deg, #be185d, #f43f5e);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.92rem; color: #fff;
      box-shadow: 0 4px 16px rgba(190,24,93,0.38);
      transition: transform 0.13s, box-shadow 0.13s;
    }
    .pl-btn:hover { transform: scale(1.09); box-shadow: 0 6px 22px rgba(190,24,93,0.55); }
    .pl-btn:active { transform: scale(0.93); }

    .br { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .time-lbl { font-size: 0.66rem; color: rgba(150,55,85,0.36); white-space: nowrap; }
    .vol-g { display: flex; align-items: center; gap: 7px; }
    .vol-ic { font-size: 0.72rem; color: rgba(180,80,110,0.28); }
    input[type=range] {
      width: 76px; -webkit-appearance: none; appearance: none;
      height: 3px; background: rgba(210,100,130,0.1);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #f43f5e;
      box-shadow: 0 0 5px rgba(244,63,94,0.38);
    }
  </style>
</head>
<body>
<div class="sky"></div>

<svg class="tree tree-l" width="200" height="280" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="220" width="18" height="100" fill="#3a1a28" rx="4"/>
  <path d="M110,220 Q70,200 50,170 Q30,140 60,130 Q40,110 70,105 Q55,80 85,80 Q80,55 108,58 Q106,30 120,40 Q134,30 132,58 Q160,55 155,80 Q185,80 170,105 Q200,110 180,130 Q210,140 190,170 Q170,200 150,220 Z" fill="#c45e82" opacity="0.82"/>
  <path d="M110,220 Q75,195 58,162 Q80,168 100,155 Q120,142 140,155 Q162,168 162,162 Q145,195 110,220 Z" fill="#e8a0b8" opacity="0.58"/>
</svg>
<svg class="tree tree-r" width="200" height="280" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="220" width="18" height="100" fill="#3a1a28" rx="4"/>
  <path d="M110,220 Q70,200 50,170 Q30,140 60,130 Q40,110 70,105 Q55,80 85,80 Q80,55 108,58 Q106,30 120,40 Q134,30 132,58 Q160,55 155,80 Q185,80 170,105 Q200,110 180,130 Q210,140 190,170 Q170,200 150,220 Z" fill="#c45e82" opacity="0.82"/>
  <path d="M110,220 Q75,195 58,162 Q80,168 100,155 Q120,142 140,155 Q162,168 162,162 Q145,195 110,220 Z" fill="#e8a0b8" opacity="0.58"/>
</svg>

<div class="ground">
  <svg viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,100 L0,40 Q360,10 720,30 Q1080,10 1440,40 L1440,100 Z" fill="#3a1a28" opacity="0.6"/>
    <path d="M0,100 L0,60 Q360,35 720,50 Q1080,35 1440,60 L1440,100 Z" fill="#2a0e1c" opacity="0.55"/>
  </svg>
</div>

<div class="couple">
  <div class="cname">Thuy Trang</div>
  <span class="cheart">♡</span>
  <div class="cname">Dinh Khang</div>
</div>

<div id="petals"></div>

<div class="bar">
  <div class="prog-strip" id="prog-strip"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="bl">
    <div class="art-box" id="art">🌸</div>
    <div class="ti">
      <div class="ti-title" id="t-title">海浪声</div>
      <div class="ti-artist" id="t-artist">Just Us</div>
    </div>
    <button class="fav-btn" id="fav">♡</button>
  </div>
  <div class="bc">
    <button class="sk-btn" id="prev">⏮</button>
    <button class="pl-btn" id="play">▶</button>
    <button class="sk-btn" id="next">⏭</button>
  </div>
  <div class="br">
    <span class="time-lbl" id="time">0:00 / 3:24</span>
    <div class="vol-g">
      <span class="vol-ic">🔈</span>
      <input type="range" min="0" max="100" value="72">
      <span class="vol-ic">🔊</span>
    </div>
  </div>
</div>

<script>
  const ns='http://www.w3.org/2000/svg';
  const shapes=['M10,0 Q16,4 12,10 Q8,14 4,10 Q0,4 6,0 Q8,-2 10,0Z','M8,0 Q14,3 11,9 Q8,13 3,9 Q0,4 5,0 Q6,-1 8,0Z'];
  const pinks=['#f9a8d4','#f472b6','#fbc2d4','#fda4af','#f0abfc'];
  const pelEl=document.getElementById('petals');
  for(let i=0;i<48;i++){
    const svg=document.createElementNS(ns,'svg'),sz=Math.random()*12+6;
    svg.setAttribute('viewBox','-2 -2 18 18');svg.setAttribute('width',sz);svg.setAttribute('height',sz);
    svg.classList.add('petal');
    svg.style.cssText=`position:fixed;left:${Math.random()*104-2}%;top:-16px;pointer-events:none;--dur:${(Math.random()*8+7).toFixed(1)}s;--delay:${(Math.random()*14).toFixed(1)}s;--drift:${((Math.random()-0.5)*180).toFixed(0)}px;--spin:${(Math.random()*720-360).toFixed(0)}deg;--op:${(Math.random()*0.45+0.3).toFixed(2)};`;
    const p=document.createElementNS(ns,'path');
    p.setAttribute('d',shapes[i%2]);p.setAttribute('fill',pinks[i%pinks.length]);
    svg.appendChild(p);pelEl.appendChild(svg);
  }

  const emojis=['🌊','💕','🌸','🌙'];
  const tracks=[
    {title:'海浪声',artist:'Just Us',dur:204},
    {title:'Together',artist:'Thuy Trang & Dinh Khang',dur:252},
    {title:'Sakura Path',artist:'Love Story',dur:238},
    {title:'Nice to Meet You',artist:'Just Us',dur:301},
  ];
  let idx=0,playing=false,elapsed=0,timer=null,faved=false;
  const art=document.getElementById('art'),playBtn=document.getElementById('play'),
        fill=document.getElementById('prog-fill'),timeEl=document.getElementById('time'),
        favBtn=document.getElementById('fav');
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60|0).padStart(2,'0')}`;
  function load(i){
    idx=i;elapsed=0;
    document.getElementById('t-title').textContent=tracks[i].title;
    document.getElementById('t-artist').textContent=tracks[i].artist;
    art.textContent=emojis[i];
    fill.style.width='0%';timeEl.textContent=`0:00 / ${fmt(tracks[i].dur)}`;
  }
  function tick(){
    elapsed++;
    if(elapsed>=tracks[idx].dur){load((idx+1)%tracks.length);if(playing)restart();return;}
    fill.style.width=(elapsed/tracks[idx].dur*100)+'%';
    timeEl.textContent=`${fmt(elapsed)} / ${fmt(tracks[idx].dur)}`;
  }
  function restart(){clearInterval(timer);timer=setInterval(tick,1000);}
  function setPlay(s){
    playing=s;art.classList.toggle('playing',s);
    playBtn.textContent=s?'⏸':'▶';
    s?restart():clearInterval(timer);
  }
  playBtn.addEventListener('click',()=>setPlay(!playing));
  document.getElementById('prev').addEventListener('click',()=>{load((idx-1+tracks.length)%tracks.length);if(playing)restart();});
  document.getElementById('next').addEventListener('click',()=>{load((idx+1)%tracks.length);if(playing)restart();});
  favBtn.addEventListener('click',()=>{faved=!faved;favBtn.classList.toggle('on',faved);favBtn.textContent=faved?'♥':'♡';});
  document.getElementById('prog-strip').addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    elapsed=Math.floor((e.clientX-r.left)/r.width*tracks[idx].dur);
    fill.style.width=(elapsed/tracks[idx].dur*100)+'%';timeEl.textContent=`${fmt(elapsed)} / ${fmt(tracks[idx].dur)}`;
  });
  load(0);
</script>
</body>
</html>
